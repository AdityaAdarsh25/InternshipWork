<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reg-form{
            width: 400px;
            padding: 25px;
            border: 2px solid black;
            border-radius: 10px;
            text-align: left;
            background-color: #f0f8ff;
        }
        h2{
            text-align:center;
        }
        .submit-button {
            text-align: center;
        }
        .reg-form input[type="text"],
        .reg-form input[type="tel"],
        .reg-form textarea {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <form id="myform">
        <div class="reg-form">
            <h2>Employee Form</h2>
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name" placeholder="Enter your full Name" ><br>
            <label for="Mobile">Mobile No:</label>
            <input type="tel" id="Mobile" name="Mobile" placeholder="Enter your mobile no"><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            Gender:
                <label>
                    <input type="radio" name="gender" value="Male">Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female">Female
                </label>
            <br>
            <label for="Address">Address:</label>
            <textarea name="address"  id="Address" placeholder="Enter your address"></textarea>
            <br><br>
            <div class="submit-button">
                <input type="submit" value="Submit">
                <input type="reset" value="reset">
            </div>
            
        </div>
    </form>
    <script src="Employee.js"></script>
</body>
</html>
